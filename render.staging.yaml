# ==============================================================================
# RicozBooks SaaS — Render Staging Blueprint Specification
# Dedicated branch: migration/next-express-mongodb
# Target Stack: Next.js 14 (App Router) + Node.js/Express.js + MongoDB Atlas
# ==============================================================================

services:
  # ============================================================================
  # 1. Express.js Backend API (Staging Web Service)
  # ============================================================================
  - type: web
    name: ricozbooks-api-staging
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    branch: migration/next-express-mongodb
    buildCommand: "npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api"
    startCommand: "node apps/api/dist/server.js"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 8000
      - key: API_PREFIX
        value: /api/v1
      - key: APP_VERSION
        value: 1.3.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard pointing to MongoDB Atlas M0 cluster
      - key: CORS_ORIGIN
        value: https://ricozbooks-web-staging.onrender.com,http://localhost:3000
      - key: SUPERADMIN_EMAIL
        value: admin@ricoz.in
      - key: SUPERADMIN_PASSWORD
        generateValue: true

  # ============================================================================
  # 2. Next.js 14 App Router Frontend (Staging Web Service)
  # ============================================================================
  - type: web
    name: ricozbooks-web-staging
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    branch: migration/next-express-mongodb
    buildCommand: "npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/web"
    startCommand: "npm run start --workspace=apps/web"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ricozbooks-api-staging.onrender.com
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
