services:
  # ==========================================
  # 1. FastAPI Backend Web Service (FREE Tier)
  # ==========================================
  - type: web
    name: ricozbooks-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ricozbooks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

  # ==========================================
  # 2. React + Vite Frontend (FREE Static Site)
  # ==========================================
  - type: web
    name: ricozbooks-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ricozbooks-api
          property: host
        value: https://ricozbooks-api.onrender.com

databases:
  # ==========================================
  # 3. PostgreSQL Database (FREE Tier)
  # ==========================================
  - name: ricozbooks-db
    plan: free
    databaseName: ricozbooks_db
    user: ricoz_user
