# ==============================================================================
# RicozBooks SaaS — Render Production Blueprint Specification
# Monorepo: Next.js 14 Web Frontend + Express.js API + MongoDB Atlas
# Production URLs:
#   - Frontend: https://ricozbooks-web.onrender.com
#   - Backend:  https://ricozbooks-api.onrender.com
# ==============================================================================

services:
  # ============================================================================
  # 1. Express.js Backend API (Production Web Service)
  # ============================================================================
  - type: web
    name: ricozbooks-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: "npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api"
    startCommand: "node apps/api/dist/server.js"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: APP_VERSION
        value: 1.3.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard pointing to MongoDB Atlas cluster
      - key: CORS_ORIGIN
        value: https://ricozbooks-web.onrender.com,https://ricozbooks.onrender.com,http://localhost:3000
      - key: SUPERADMIN_EMAIL
        value: admin@ricoz.in
      - key: SUPERADMIN_PASSWORD
        generateValue: true

  # ============================================================================
  # 2. Next.js 14 App Router Web Frontend (Production Web Service)
  # ============================================================================
  - type: web
    name: ricozbooks-web
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: "npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/web"
    startCommand: "npm run start --workspace=apps/web"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://ricozbooks-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://ricozbooks-api.onrender.com
      - key: NEXT_PUBLIC_APP_ENV
        value: production
